name = "mcp-authkit"
main = "src/worker.js"
compatibility_date = "2024-12-01"

[vars]
SALT = "change-me-to-a-random-string"
# Sender for password-reset emails. Must be a Resend-verified domain.
RESEND_FROM = "OpZero <no-reply@auth.opzero.sh>"

# Secrets (set via wrangler secret put):
#   wrangler secret put ADMIN_KEY        # auth for /api/servers registration
#   wrangler secret put RESEND_API_KEY   # Resend key for password-reset email

[[d1_databases]]
binding = "DB"
database_name = "mcp-authkit-db"
database_id = "d8c71aec-fef5-4cb4-8193-7ca389316c08"

# Custom domain (optional — requires zone on Cloudflare)
# [env.production]
# routes = [
#   { pattern = "authkit.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]
